aid: grips-intelligence
name: Grips Intelligence
description: >-
  Grips Intelligence (Peekd) is an e-commerce intelligence platform that provides
  daily online and offline product sales measurement and competitive analysis. It
  tracks competitor metrics — units sold, pricing, revenue per product, top sellers,
  and new product launches — across major retailers, alongside domain-level site
  metrics such as revenue, conversion rate, average order value, and traffic sources.
  Data is available at SKU and category granularity for brand and category
  benchmarking and new-product opportunity discovery. Grips exposes a REST Data API
  (API-key authenticated) and an OAuth-protected remote MCP server ("Peekd Data MCP")
  that make its intelligence data programmatically and agent-accessible.
