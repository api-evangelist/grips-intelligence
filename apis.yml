    HTTPS POSTs carrying a GraphQL-style query envelope (query + variables), scoped
    by domain, date range, and country. Endpoints include Domain Timeseries
    Performance, CI Channels, RI Adwords Over Time, and CI Devices. Authenticated
    with a per-account `grips-api-key` header.
